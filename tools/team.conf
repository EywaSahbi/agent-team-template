# Team config: which roles exist, which GitHub login runs each one, and where each role may commit.
# Read by tools/board.py (message routing) and tools/hooks/pre-commit (ownership guard). Owned by lead.
#
# Settings:  key = value
# Roles:     <role>  <github-login>  <path prefixes this role may commit, space-separated>
#   - role names are lowercase, one word (they are used as `--to <role>` and `[role]` on the board)
#   - a prefix ending in / is a folder; anything else matches every path starting with it
#     (`api/src/llm` matches api/src/llm.py and api/src/llm_openai.py), so a role can own single files
#   - one login may run several roles, each agent in its own clone with its own `git config team.role`
#   - no spaces inside paths
# Keep the table in AGENTS.md -> "Team and ownership" in sync with this file.

# repo = owner/name          # default: the GitHub repo this clone was cloned from
board = 1                    # issue number of the pinned message board (`python3 tools/board.py init` sets it)

lead      your-github-login   lead/ AGENTS.md CLAUDE.md README.md docs/ templates/ tools/ .claude/ .codex/ .gitignore .gitattributes
backend   your-github-login   backend/
frontend  teammate-login      frontend/
# qa      teammate-login      qa/
